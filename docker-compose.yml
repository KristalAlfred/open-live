services:
  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env (see .env.example)}
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data

  open-live:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      COUCHDB_URL: http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD}@couchdb:5984
      COUCHDB_NAME: open-live
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      # Required for production deployments — set a strong random secret.
      # Omit (or leave unset) only when running behind an external auth layer.
      API_KEY: ${API_KEY:?Set API_KEY in .env (see .env.example)}
      STROM_URL: http://strom:8080
      SOURCE_PROVIDERS: ${SOURCE_PROVIDERS:-}
      WEAVE_NORTHBOUND_URL: ${WEAVE_NORTHBOUND_URL:-}
      WEAVE_NORTHBOUND_TOKEN: ${WEAVE_NORTHBOUND_TOKEN:-}
    depends_on:
      couchdb:
        condition: service_started
      strom:
        condition: service_healthy

  # Also joins the open-weave bench's core network, so it can dial the SRT
  # outputs the weave provider lists. The bench's route-manager installs the
  # routes into the node subnets by this container's name, and the network is
  # created by the bench (`just bench up` in open-weave), so bring that up first.
  strom:
    image: eyevinntechnology/strom:latest
    container_name: ow-open-live-strom
    environment:
      STROM_PORT: "8080"
      STROM_DATA_DIR: /data
      # Handed to browsers via /api/ice-servers. The TURN entry names the port
      # published below, so a browser on the Docker host relays through coturn;
      # Strom itself resolves `localhost` to its own container and gathers no
      # relay candidates, which it does not need.
      STROM_SERVER_ICE_SERVERS: stun:stun.l.google.com:19302,turn:openlive:openlive@localhost:3478?transport=tcp
    volumes:
      - strom_data:/data
    ports:
      - "28083:8080"
    networks:
      default: {}
      weave_bench:
        ipv4_address: 172.25.0.50
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  # A browser on the Docker host cannot reach Strom's container addresses, and
  # Chrome hides the browser's own address behind mDNS unless the page holds
  # camera or microphone permission, so without a relay ICE has no pair that
  # works. coturn relays between the browser (TCP 3478 on the host) and Strom
  # (this compose network). Dev credentials, like the ports and origins above.
  coturn:
    image: coturn/coturn:latest
    command:
      - --lt-cred-mech
      - --user=openlive:openlive
      - --realm=open-live
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-udp
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --log-file=stdout
    ports:
      - "3478:3478/tcp"

networks:
  weave_bench:
    name: ow-bench_net_core
    external: true

volumes:
  couchdb_data:
  strom_data:
